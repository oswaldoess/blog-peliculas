name: blog_peliculas
description: "App móvil de un blog de reseñas de películas (Flutter + FastAPI + MySQL)."
publish_to: 'none'

version: 2.0.0+2

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  # Peticiones HTTP a la API de FastAPI
  http: ^1.6.0
  # Guarda el token de sesión cifrado (Keystore en Android / Keychain en iOS)
  flutter_secure_storage: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
